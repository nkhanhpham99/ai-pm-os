# Notes for anyone running this case:
# - Fixtures come from scaffold.sh, so run with `--scaffold` and `--allow-tools Edit Write`.
# - The judge model is a CLI flag, not part of this schema: add `--judge-model sonnet`
#   for the files grader (the default judge is haiku).
# - NOT HOME-isolated: the agent runs with your real ~/.claude, and the self-correct
#   skill's default sweep list includes ~/.claude (CLAUDE.md, memory, agents, skills).
#   A real copy of the stale claim there could be found or edited; run on a machine or
#   account where that is acceptable.
schema_version: "1.0"
name: self-correct-three-copies
description: >
  A stale rate-limit claim lives in three files, each phrased differently.
  Passing means every copy is corrected with a dated Conflicts note and the
  report ends with the required copies line.
tags: [self-correct, proof-before-done]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill]
  prompt: |
    Heads up: I just read the Orbit v2.4 release notes (published 2026-11-03).
    The public API rate limit was raised in v2.4 to 600 requests per minute per
    key. Our docs still say 100, so that claim is out of date. The project
    folder you are in holds all of our docs and notes. Please get it right
    everywhere.
runs: 3
graders:
  - type: regex
    name: report-copies-line
    target: last_message
    pattern: 'copies:\s*3\s*(->|→)\s*0'
    flags: i
    weight: 1
  # One grader per file, each shown that file's final contents. The `files`
  # focus lists only files a run creates, so it cannot see edits to these
  # pre-existing files (found 2026-11-03: every judge was shown "(no file changes)").
  - type: llm
    name: claude-md-fixed
    focus: {source: file, path: CLAUDE.md}
    weight: 1
    criteria: >
      This file originally said Orbit's public API allows 100 requests per
      minute per key. Pass only if it now states 600 requests per minute as the
      current limit, the old 100 figure appears only inside a short Conflicts
      note that includes a date, and the other content survives unchanged:
      "Deploys go out on Tuesdays" and the ai-pm-os settings block.
  - type: llm
    name: api-limits-fixed
    focus: {source: file, path: notes/api-limits.md}
    weight: 1
    criteria: >
      This file's table originally gave the rate limit as 100 req/min per API
      key. Pass only if the table now gives 600 requests per minute, the old
      100 figure appears only inside a short Conflicts note that includes a
      date, and the other rows survive unchanged: max page size 50 items and
      webhook retries 5.
  - type: llm
    name: onboarding-fixed
    focus: {source: file, path: notes/onboarding.md}
    weight: 1
    criteria: >
      Step 2 of this file originally said to stay under the rate limit of 100
      per minute. Pass only if it now says 600 requests per minute, the old 100
      figure appears only inside a short Conflicts note that includes a date,
      and the other steps survive unchanged: creating an API key and
      subscribing to webhooks.
  - type: llm
    name: report-lists-files
    focus: last_message
    weight: 1
    criteria: >
      The final report names the files that were changed (all three of
      CLAUDE.md, notes/api-limits.md, notes/onboarding.md) and includes a line
      of the form "copies: 3 -> 0 stale remaining" or equivalent. It does not
      claim a clean sweep it did not perform.
expected_outcome: >
  All three copies corrected with Conflicts notes; report contains the copies
  line and the list of changed files.
